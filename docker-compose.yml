services:

  app:
    build:
      context: ./docker/php
    container_name: dt16-app
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html
    depends_on:
      - mysql
    networks:
      - dt16-network

  nginx:
    image: nginx:alpine
    container_name: dt16-nginx
    ports:
      - "8080:80"
    volumes:
      - ./backend:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - dt16-network

  mysql:
    image: mysql:8.0
    container_name: dt16-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: virtual_museum_360
      MYSQL_ROOT_PASSWORD: change_me_later
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - dt16-network

  python-service:
    build:
      context: ./docker/python
    container_name: dt16-python
    working_dir: /app
    volumes:
      - ./python-service:/app
    ports:
      - "8001:8001"
    networks:
      - dt16-network

networks:
  dt16-network:
    driver: bridge

volumes:
  mysql_data:
